[package]
name = "stamp-cli"
version = "0.3.6"
edition = "2024"
description = "A cli tool for applying templates with intelligent merging"
license = "Apache-2.0"
repository = "https://github.com/mcmah309/stamp-cli"

[[bin]]
name = "stamp"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "mcmah309 <dillonmcmahon79@gmail.com>"
license-file = ["LICENSE", "0"]
extended-description = "Manage, register, and render project templates with interactive questions and intelligent merging of existing files."
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
    ["target/release/stamp", "usr/bin/stamp", "755"],
    ["README.md", "usr/share/doc/stamp-cli/README.md", "644"],
]

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
tera = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
directories = "6.0.0"
eros = { version = "0.8.1", features = ["user_context"] }
walkdir = "2.5.0"
indexmap = { version = "2.13.0", features = ["serde"] }
toml = "0.9.8"
dialoguer = "0.12.0"
console = "0.16.2"
ignore = "0.4.25"
pulldown-cmark = { version = "0.13.4", default-features = false }
toml_edit = "0.25.16"
serde_yaml_ng = "0.10.0"
similar = { version = "3.2.0", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(unix)'.dev-dependencies]
expectrl = "0.9.0"
